spring.application.name=librairie

# Connexion à la base H2 (en mémoire)
spring.datasource.url=jdbc:h2:mem:librairie
spring.datasource.username=sa
spring.datasource.password=

# Active la console web de H2
spring.h2.console.enabled=true

# Affiche dans la console les requêtes SQL générées
spring.jpa.show-sql=true